<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>To-Do-List</h1>
    <div>
        <input placeholder="Search tasks" type="text" id="search">
    </div>
    <div class="input">
        <input placeholder="Add your task here" type="text" id="task">
        <input type="date" id="start-date">
        <input type="time" id="time">
        <button class="button">Add Task</button>
    </div>
    
    <div id="custom-alert" class="alert-box">
        <button id="close-alert" class="close-alert">×</button>
        <p id="alert-message">Please fill in all fields.</p>
        <button id="ok-alert">OK</button>
    </div>

    <script src="pro.js"></script>
</body>
</html>
